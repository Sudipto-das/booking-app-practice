<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking App</title>
</head>

<body>
    <form onsubmit="bookBusTicket(event)">
        <input name="name" placeholder="Name" id="name" type="text" />
        <br><br>

        <input name="email" placeholder="Email" id="email" type="email" />
        <br><br>

        <input name="phone" placeholder="Phone" id="phone" type="tel" />
        <br><br>

        <label for="bus">Bus No.</label>
        <select id="bus" name="bus">
            <option value="">Select a bus</option>
            <option value="bus1">Bus 1</option>
            <option value="bus2">Bus 2</option>
            <option value="bus3">Bus 3</option>
        </select>
        <br><br>
        <button id="book-btn" type="submit">Book Now</button>
    </form>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
